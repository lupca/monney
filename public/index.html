<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6650">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sổ Tiền Của Tùng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one pocket-ledger column. "Hôm nay" is a game screen (daily allowance ring, jar, streak); the rest are tools. Tab bar fixed at the bottom. */
:root{
  --bg:#eef3ef; --surface:#ffffff; --sunk:#e3eae5; --ink:#15211d; --muted:#596862; --line:#d3ddd7;
  --accent:#0d6650; --accent-ink:#ffffff; --accent-soft:#d6ebe3; --accent-2:#0a4f3e;
  --gold:#a8730f; --gold-soft:#f7ebcf; --gold-ink:#5c3d00;
  --good:#2b7a47; --warn:#a85f0d; --bad:#ad342c; --good-soft:#dcefe2; --warn-soft:#f6e7d0; --bad-soft:#f6dbd8;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#141f1b; --sunk:#1b2823; --ink:#e4ede8; --muted:#94a59d; --line:#26352f;
  --accent:#4cbc95; --accent-ink:#06140f; --accent-soft:#173a2e; --accent-2:#0f2e25;
  --gold:#e0b257; --gold-soft:#3a2d12; --gold-ink:#f6dc9f;
  --good:#62c283; --warn:#e49a3e; --bad:#ea6c61; --good-soft:#15321f; --warn-soft:#3a2a14; --bad-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#141f1b; --sunk:#1b2823; --ink:#e4ede8; --muted:#94a59d; --line:#26352f;
  --accent:#4cbc95; --accent-ink:#06140f; --accent-soft:#173a2e; --accent-2:#0f2e25;
  --gold:#e0b257; --gold-soft:#3a2d12; --gold-ink:#f6dc9f;
  --good:#62c283; --warn:#e49a3e; --bad:#ea6c61; --good-soft:#15321f; --warn-soft:#3a2a14; --bad-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 4px}
.hello{font-family:var(--f-disp);font-weight:800;font-size:22px;line-height:1.15}
.hello small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.lvchip{display:flex;align-items:center;gap:8px;background:var(--gold-soft);color:var(--gold-ink);border-radius:99px;padding:5px 12px 5px 6px;font-size:13px;font-weight:700;white-space:nowrap}
.lvchip b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--surface);font-size:12px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700}
section.view{display:grid;gap:14px;padding-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.big{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1.1}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:370px){.grid2{grid-template-columns:1fr}}

/* Today hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero .ring{width:118px;height:118px;position:relative;flex:none}
.hero .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero .ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.hero .ring .c b{font-family:var(--f-disp);font-size:22px;font-weight:800;display:block}
.hero .ring .c span{font-size:11px;opacity:.85}
.hero .msg{font-size:14px;opacity:.95}
.hero .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;opacity:.8;font-weight:600}
.hero .left{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1.05;margin:2px 0 6px}
@media (max-width:370px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:center;display:grid;gap:2px;align-content:start}
.stat .ico{font-size:20px;line-height:1}
.stat .v{font-family:var(--f-disp);font-weight:800;font-size:20px;line-height:1.1}
.stat .t{font-size:11.5px;color:var(--muted);line-height:1.3}
.stat.gold{background:var(--gold-soft);border-color:transparent}
.stat.gold .v{color:var(--gold-ink)}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.qbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px dashed var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600;text-align:left}
.qbtn span{color:var(--muted);font-weight:500;font-size:13px}
.qbtn:active{transform:scale(.97)}

/* wish / temptation */
.wish{background:var(--gold-soft);border-radius:var(--r);padding:16px;display:grid;gap:10px;color:var(--ink)}
.wish h3{color:var(--gold-ink)}
.impact{display:grid;gap:6px;font-size:14px}
.impact div{display:flex;gap:8px;align-items:baseline}
.impact b{font-family:var(--f-disp);font-size:18px;min-width:64px}
.wl{display:grid}
.witem{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.witem:first-child{border-top:0}

/* lists */
.list{display:grid}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap;text-align:right}
.date{width:46px;flex:none;text-align:center;border-radius:8px;background:var(--sunk);padding:4px 0;line-height:1.15}
.date b{display:block;font-family:var(--f-disp);font-size:18px}
.date span{font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.chk{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;display:grid;place-items:center}
.chk.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.chk svg{width:16px;height:16px}

/* journey */
.lvcard{background:var(--accent-2);color:#eaf6f1;border-radius:20px;padding:18px;display:grid;gap:10px}
:root .lvcard{--lvtrack:rgba(255,255,255,.16)}
.lvcard .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;opacity:.75;font-weight:600}
.lvcard .name{font-family:var(--f-disp);font-weight:800;font-size:24px;line-height:1.1}
.xp{height:12px;border-radius:99px;background:var(--lvtrack);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#e0b257,#f3d58f);border-radius:99px}
.lvcard .ends{display:flex;justify-content:space-between;font-size:12.5px;opacity:.85}
.road{display:grid;gap:0;position:relative}
.ms{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding-bottom:16px;position:relative}
.ms:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.ms.done:not(:last-child)::before{background:var(--good)}
.ms .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;background:var(--sunk);color:var(--muted);border:2px solid var(--line)}
.ms.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.ms.next .dot{background:var(--gold);border-color:var(--gold);color:var(--surface);box-shadow:0 0 0 5px var(--gold-soft)}
.ms .t{font-weight:700;line-height:1.3}
.ms .s{font-size:13px;color:var(--muted)}
.ms .when{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.ms.next .t{color:var(--gold-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{border-radius:14px;padding:12px 8px;text-align:center;display:grid;gap:4px;justify-items:center;background:var(--sunk);color:var(--muted)}
.badge .em{font-size:28px;line-height:1;filter:grayscale(1);opacity:.45}
.badge .n{font-size:12.5px;font-weight:700;line-height:1.25}
.badge .p{font-size:11px}
.badge.on{background:var(--gold-soft);color:var(--gold-ink)}
.badge.on .em{filter:none;opacity:1}

/* budget */
.zero{border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.zero.ok{background:var(--good-soft);color:var(--good)}
.zero.left{background:var(--warn-soft);color:var(--warn)}
.zero.over{background:var(--bad-soft);color:var(--bad)}
.zero .v{font-family:var(--f-disp);font-weight:800;font-size:24px}
.explain{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13.5px;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk);margin-top:10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:8px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--bad)}
.bline{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.bline:first-child{border-top:0}
.bline .nm{font-weight:600}
.bline .sp{grid-column:1/-1;font-size:12px;color:var(--muted)}

/* forms */
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.wish input{background:var(--surface)}
input.money{width:130px;text-align:right}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 13px;font-weight:600}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.goldb{background:var(--gold);color:var(--surface);border-color:var(--gold)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
button.sm{font-size:13px;padding:6px 10px}
button:disabled{opacity:.5;cursor:default}
form.f{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>button{flex:1}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{font-size:18px}
.mgroup{display:grid;gap:4px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px}
.mhead b{font-family:var(--f-disp);font-size:16px}
.chart{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;font-size:12.5px}
.crow .track{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden;position:relative}
.crow .track i{display:block;height:100%;background:var(--accent);opacity:.8}
.crow.now .track i{background:var(--gold);opacity:1}
.crow .v{text-align:right;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.empty{text-align:center;padding:20px 10px;color:var(--muted)}
.prog{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.prog i{width:10px;height:6px;border-radius:2px;background:var(--sunk)}
.prog i.p{background:var(--good)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted)}
.day i{width:100%;aspect-ratio:1;max-width:38px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--sunk)}
.day.ok i{background:var(--good-soft);color:var(--good)}
.day.over i{background:var(--bad-soft);color:var(--bad)}
.day.today i{outline:2px solid var(--gold);outline-offset:1px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:8px 2px 10px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--accent)}

/* tappable surfaces + detail sheet */
.hero{border:0;width:100%;text-align:left;font-weight:400;cursor:pointer}
.hero .more,.lvcard .more{font-size:12.5px;opacity:.8;font-weight:600;margin-top:6px;text-align:left}
button.stat{font-weight:400;cursor:pointer;width:100%}
button.day{background:transparent;border:0;padding:0;font-weight:400;color:var(--muted);cursor:pointer}
button.lvcard{border:0;width:100%;text-align:left;font-weight:400;cursor:pointer;color:#eaf6f1}
.nextms{width:100%;text-align:left;border-color:var(--gold);display:grid;gap:4px;font-weight:400;cursor:pointer}
button.ms{border:0;background:transparent;padding:0 0 16px;width:100%;font-weight:400;text-align:left;cursor:pointer;color:inherit;border-radius:0}
button.badge{border:0;font-weight:400;cursor:pointer;width:100%}
.badge .mini{width:70%;height:4px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:2px}
.badge .mini i{display:block;height:100%;background:var(--gold)}
.badge.on .mini{display:none}
.item.rowbtn{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:11px 0;font-weight:400;text-align:left;cursor:pointer;color:inherit}
.item.rowbtn:first-child{border-top:0}
.chev{color:var(--muted);font-size:18px;line-height:1}
.linkish{background:transparent;border:0;padding:0;font-weight:inherit;text-align:left;color:inherit;cursor:pointer;border-radius:4px}
.main.linkish{flex:1;min-width:0}
.bline .nm.linkish{color:var(--accent);font-weight:600}
button.crow{border:0;background:transparent;padding:3px 0;width:100%;font-weight:400;text-align:left;cursor:pointer;color:inherit}
.jtabs button{font-size:13.5px;padding:8px 4px}
.jtabs small{opacity:.6;font-weight:500}
.dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--sunk);color:var(--muted)}
.dot.ok{background:var(--good-soft);color:var(--good)}
.dot.over{background:var(--bad-soft);color:var(--bad)}
.dot.gold{background:var(--gold);color:var(--surface)}
.lvrow.now{background:var(--gold-soft);border-radius:10px;padding-inline:8px}
.neg{color:var(--bad)!important}.pos{color:var(--good)!important}
.sheet{position:fixed;inset:0;z-index:30}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;max-width:620px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none}
.sheet-head h3{font-size:18px;min-width:0}
#sheetBody{overflow-y:auto;padding-block:2px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px;align-content:start;overscroll-behavior:contain}
#sheetBody h4{margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
#sheetBody .note{margin:0}
.sheet-big{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1.1}
.kvs{background:var(--bg);border-radius:12px;padding:2px 12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.verdict{border-radius:10px;padding:10px 12px;font-weight:600;background:var(--sunk)}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.over{background:var(--bad-soft);color:var(--bad)}
.verdict.gold{background:var(--gold-soft);color:var(--gold-ink)}
.empty.sm{padding:10px}
.badge-hero{display:grid;place-items:center;width:96px;height:96px;margin:4px auto 0;border-radius:50%;background:var(--sunk);font-size:48px}
.badge-hero span{filter:grayscale(1);opacity:.45}
.badge-hero.on{background:var(--gold-soft)}
.badge-hero.on span{filter:none;opacity:1}
details.fold summary{cursor:pointer;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary h3::after{content:" ›";color:var(--muted)}
details.fold[open] summary h3::after{content:" ⌄"}
details.fold[open] summary{margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.sheet-panel{animation:sheetup .22s ease}@keyframes sheetup{from{transform:translateY(40px);opacity:.5}}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 10px 9px 14px;border-radius:10px;font-size:13.5px;z-index:40;max-width:92vw;display:flex;gap:10px;align-items:center}
#toast button{background:transparent;border:0;color:var(--gold);padding:2px 6px}
@media (prefers-reduced-motion:no-preference){.xp i,.bar i,.hero .ring circle{transition:width .5s ease,stroke-dashoffset .6s ease}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="hello" id="hello">Sổ tiền<small>Đang mở sổ…</small></div>
    <div class="lvchip" id="lvchip" hidden></div>
  </header>
  <div id="loadNote" class="banner" hidden>Chưa tải được dữ liệu. Có thể mạng đang chậm, chờ một chút nhé.</div>

<script>
const CATS=[
  {id:'nha',name:'Tiền nhà'},{id:'an',name:'Ăn uống'},{id:'dilai',name:'Đi lại, xăng xe'},
  {id:'dt',name:'Điện thoại, mạng'},{id:'congviec',name:'Công cụ làm việc'},{id:'choi',name:'Tiêu thoải mái'},
  {id:'khac',name:'Linh tinh, hiếu hỉ'},{id:'caumo',name:'Trả cậu mợ'},{id:'tranguoi',name:'Trả nợ người quen'},{id:'duphong',name:'Dự phòng (để dành)'}
];
const INCATS=[{id:'luong',name:'Lương'},{id:'lamthem',name:'Làm thêm'},{id:'khac_in',name:'Thu khác'}];
const FLEX=['an','choi'];
const QUICK_DEFAULT=[{label:'Bánh mì',amount:35000,cat:'an'},{label:'Cơm gà',amount:45000,cat:'an'},{label:'Cháo',amount:35000,cat:'an'},{label:'Đổ xăng',amount:75000,cat:'dilai'},{label:'Cà phê',amount:39000,cat:'choi'}];
const LEVELS=[[0,'Tân binh thoát nợ'],[.1,'Người cắt lãi'],[.25,'Chiến binh trả góp'],[.5,'Nửa đường tự do'],[.75,'Sắp về đích'],[1,'Tự do tài chính']];
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtIn=n=>{n=Math.round(Number(n)||0);return n?n.toLocaleString('vi-VN'):'0'};
const parseMoney=v=>Math.round(Number(String(v||'').replace(/[^\d]/g,''))||0);
const vnd=n=>Math.round(n||0).toLocaleString('vi-VN')+'đ';
const k=n=>{const a=Math.abs(n||0);return (n<0?'−':'')+(a>=1e6?(Math.round(a/1e5)/10).toLocaleString('vi-VN')+'tr':Math.round(a/1000)+'k')};
const tr=n=>{const v=(n||0)/1e6;const r=Math.abs(v)>=100?Math.round(v):Math.round(v*10)/10;return r.toLocaleString('vi-VN')+'tr'};
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const D=s=>new Date(s+'T00:00');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addDay=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((D(b)-D(a))/864e5);
const addYm=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+p2(m)};
const dim=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const mName=ym=>{const[y,m]=ym.split('-');return 'Tháng '+Number(m)+'/'+y};
const mShort=ym=>{const[y,m]=ym.split('-');return 'T'+Number(m)+'/'+y.slice(2)};
const dd=s=>s.slice(8,10), mm=s=>Number(s.slice(5,7));
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>';
const catName=id=>{if(id&&id.startsWith('f_')){const f=S.funds.find(x=>'f_'+x.id===id);return f?('Quỹ '+f.name):'Quỹ'}return (CATS.find(c=>c.id===id)||INCATS.find(c=>c.id===id)||{name:id||'Khác'}).name};

const S={loaded:false,meta:null,debts:[],payments:{},txns:[],budgets:{},funds:[],wishes:[],got:0,view:'hom-nay',bYm:null,tYm:null,txDir:'out',showAll:false,confirmDel:null,jTab:'moc',sheet:null};
let db=null, canWrite=false;

/* ---------- money logic ---------- */
function schedule(d){
  if(d.closed||d.kind==='family'||!d.first) return [];
  const out=[];
  for(let ym=d.first; ym<=d.last; ym=addYm(ym,1)){
    const a=(d.amounts&&d.amounts[ym]!=null)?d.amounts[ym]:(ym===d.last&&d.lastAmount?d.lastAmount:d.monthly);
    const key=d.id+'_'+ym;
    out.push({debt:d,ym,date:ym+'-'+p2(Math.min(d.day||1,dim(ym))),amount:a,key,paid:!!S.payments[key]});
  }
  return out;
}
const items=()=>S.debts.flatMap(schedule).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const remainingOf=d=>{
  if(d.kind==='family'){const rc=d.repayCat||'caumo';const back=S.txns.filter(t=>t.dir==='out'&&t.cat===rc).reduce((s,t)=>s+t.amount,0);return Math.max(0,(d.remaining||0)-back)}
  return schedule(d).filter(i=>!i.paid).reduce((s,i)=>s+i.amount,0);
};
const lastYm=d=>d.last||'';
function cash(){
  const m=S.meta; if(!m) return null;
  let c=m.cashStart||0; const from=m.cashStartDate||'0000';
  for(const t of S.txns){ if(t.date>=from) c+= t.dir==='in'?t.amount:-t.amount }
  for(const key in S.payments){const p=S.payments[key]; if((p.paidAt||'')>=from) c-=p.amount||0}
  return c;
}
const fundSaved=f=>(f.saved||0)+S.txns.filter(t=>t.cat==='f_'+f.id).reduce((s,t)=>s+(t.dir==='out'?t.amount:-t.amount),0);
const fundsTotal=()=>S.funds.reduce((s,f)=>s+fundSaved(f),0);
const appDebts=()=>S.debts.filter(d=>!d.closed&&d.kind!=='family');
const family=()=>S.debts.find(d=>d.kind==='family');
function netDebt(){
  const a=appDebts().reduce((s,d)=>s+remainingOf(d),0), f=S.debts.filter(d=>d.kind==='family').reduce((s,d)=>s+remainingOf(d),0), c=cash()||0;
  return a+f-c-fundsTotal();
}
function level(){
  const start=S.meta?.netStart||300000000, net=netDebt();
  const p=Math.max(0,Math.min(1,(start-net)/start));
  let i=0;LEVELS.forEach((l,j)=>{if(p>=l[0])i=j});
  const next=LEVELS[i+1];
  return {p,i:i+1,name:LEVELS[i][1],next:next?next[1]:null,nextAt:next?next[0]:1,start,net};
}
function monthDebt(ym){return items().filter(i=>i.ym===ym)}
function budgetCalc(ym){
  const b=S.budgets[ym]; if(!b) return null;
  const debtPlan=monthDebt(ym).reduce((s,i)=>s+i.amount,0);
  const lines=b.lines||{};
  const sumLines=Object.values(lines).reduce((s,v)=>s+(Number(v)||0),0);
  const avail=(b.start||0)+(b.income||0);
  return {b,debtPlan,sumLines,avail,left:avail-debtPlan-sumLines};
}
const spent=(ym,cat)=>S.txns.filter(t=>t.dir==='out'&&t.cat===cat&&t.date.slice(0,7)===ym).reduce((s,t)=>s+t.amount,0);

/* daily game */
function period(ym){const from=S.meta?.cashStartDate||'';const start=from.slice(0,7)===ym?from:ym+'-01';const end=ym+'-'+p2(dim(ym));return{start,end,days:diffDays(start,end)+1}}
function allowance(ym){const b=S.budgets[ym];if(!b)return null;const L=b.lines||{};return FLEX.reduce((s,c)=>s+(Number(L[c])||0),0)/period(ym).days}
const flexSpent=d=>S.txns.filter(t=>t.dir==='out'&&t.date===d&&FLEX.includes(t.cat)).reduce((s,t)=>s+t.amount,0);
const trackStart=()=>S.meta?.cashStartDate||todayS();
function dayOk(d){const a=allowance(d.slice(0,7));return a==null?null:flexSpent(d)<=a}
function streaks(){
  const t=todayS(), st=trackStart(); let cur=0,best=0,run=0;
  for(let d=st; d<t; d=addDay(d,1)){const ok=dayOk(d); if(ok===null) continue; run=ok?run+1:0; best=Math.max(best,run)}
  cur=run; return {cur,best};
}
function jar(ym){
  const t=todayS(), p=period(ym), a=allowance(ym); let s=0;
  if(a!=null) for(let d=p.start; d<=p.end && d<t; d=addDay(d,1)) s+=a-flexSpent(d);
  const skipped=S.wishes.filter(w=>w.status==='skipped'&&(w.decidedAt||w.createdAt||'').slice(0,7)===ym).reduce((x,w)=>x+w.price,0);
  return {daily:s,skipped,total:s+skipped};
}
const skippedAll=()=>S.wishes.filter(w=>w.status==='skipped').reduce((s,w)=>s+w.price,0);
const noLoanDays=()=>Math.max(0,diffDays(S.meta?.noNewLoanSince||trackStart(),todayS()));
const hourly=()=>(S.meta?.incomeMonthly||18000000)/26/8;

/* milestones & badges */
function milestones(){
  const list=[];
  const closed=S.debts.filter(d=>d.closed);
  list.push({t:'Tất toán các khoản lãi cao nhất',s:closed.length>=3?closed.length+' khoản đã xóa sổ':'Còn '+(3-closed.length)+' khoản',done:closed.length>=3,ym:'2026-11',
    desc:'Trả dứt các khoản vay lãi 48–80%/năm bằng tiền mượn không lãi.',closedList:closed});
  const groups={};
  appDebts().forEach(d=>{const g=d.app==='Shopee'?'Shopee':d.id;(groups[g]=groups[g]||[]).push(d)});
  for(const g in groups){const ds=groups[g];const last=ds.map(lastYm).sort().pop();const rem=ds.reduce((s,d)=>s+remainingOf(d),0);
    list.push({t:g==='Shopee'?'Xóa sổ Shopee':'Xong '+ds[0].name,s:rem?'Còn '+vnd(rem):'Đã trả hết',done:rem===0,ym:last,ds,
      desc:g==='Shopee'?'Trả hết SEasy và SPayLater.':'Trả kỳ cuối của '+ds[0].name+'.'})}
  const appAll=appDebts().filter(d=>d.id!=='homecredit');
  const appLast=appAll.map(lastYm).sort().pop()||'2027-10';
  list.push({t:'Hết sạch nợ app lãi cao',s:'Chỉ còn Home Credit và cậu mợ',done:appAll.every(d=>remainingOf(d)===0),ym:appLast,big:true,ds:appAll,
    desc:'Mọi khoản app và thẻ (trừ Home Credit) về 0. Từ đây mỗi tháng bắt đầu dư nhiều.'});
  const f=family(); if(f){const r=remainingOf(f);list.push({t:'Trả xong cậu mợ',s:r?'Còn '+vnd(r):'Đã trả hết',done:r===0,ym:addYm(appLast,Math.ceil(r/8e6)||0),est:true,ds:[f],
    desc:'Ước tính nếu mỗi tháng dồn khoảng 8tr sau khi hết nợ app. Ghi giao dịch mục "Trả cậu mợ" để trừ dần.'})}
  const kc=S.funds.find(x=>/khẩn|khan/i.test(x.name));
  list.push({t:'Quỹ khẩn cấp 30tr',s:kc?tr(fundSaved(kc))+' / '+tr(kc.target):'Chưa lập hũ',done:kc?fundSaved(kc)>=kc.target:false,ym:addYm(appLast,4),est:true,
    desc:'Khoản tiền của riêng bạn, đủ sống 2–3 tháng. Có nó rồi thì lúc kẹt không phải tìm đến app vay nữa.'});
  list.sort((a,b)=>a.done!==b.done?(a.done?-1:1):(a.ym<b.ym?-1:a.ym>b.ym?1:0));
  const ni=list.findIndex(m=>!m.done); if(ni>=0) list[ni].next=true;
  return list;
}
function badges(){
  const st=streaks(), nl=noLoanDays(), closed=S.debts.filter(d=>d.closed).length;
  const onTime=Object.keys(S.payments).filter(key=>{const p=S.payments[key];const it=items().find(i=>i.key===key);return it&&(p.paidAt||'')<=it.date}).length;
  const sk=S.wishes.filter(w=>w.status==='skipped'), skT=skippedAll();
  const tet=S.funds.find(f=>/tết|tet/i.test(f.name));
  const tp=S.debts.find(d=>d.id==='tpbank');
  const lv=level();
  const B=(em,n,cur,target,desc,unit)=>({em,n,cur:Math.max(0,Math.min(cur,target)),target,on:cur>=target,desc,unit:unit||''});
  return [
    B('✂️','Cắt lãi cắt cổ',closed,3,'Tất toán 3 khoản vay lãi cao nhất.',' khoản'),
    B('🌱','7 ngày không vay',nl,7,'7 ngày liên tục không mở khoản vay mới nào.',' ngày'),
    B('🛡️','1 tháng sạch nợ mới',nl,30,'30 ngày liên tục không vay mới.',' ngày'),
    B('🏯','100 ngày tự chủ',nl,100,'100 ngày liên tục không vay mới.',' ngày'),
    B('🔥','Tuần giữ mức',st.best,7,'7 ngày liên tiếp tiêu ăn uống và tiêu thoải mái không vượt mức ngày.',' ngày'),
    B('🌕','Tháng giữ mức',st.best,30,'30 ngày liên tiếp giữ mức ngày.',' ngày'),
    B('⏰','Trả đúng hạn ×5',onTime,5,'5 kỳ nợ được đánh dấu trả trước hoặc đúng ngày hạn.',' kỳ'),
    B('🏅','Trả đúng hạn ×20',onTime,20,'20 kỳ nợ trả đúng hạn.',' kỳ'),
    B('🙅','Nói "không" lần đầu',sk.length,1,'Bỏ qua một món ở thẻ "Muốn mua gì à?" trang Hôm nay.',' món'),
    B('💪','Từ chối 1 triệu',skT,1e6,'Tổng tiền các món đã bỏ qua đạt 1 triệu.','đ'),
    B('💳','Hết nợ thẻ',tp&&remainingOf(tp)===0?1:0,1,'Trả hết dư nợ thẻ TPBank, đánh dấu ở Lịch trả.',''),
    B('🧧','Đủ quỹ Tết',tet?fundSaved(tet):0,tet?tet.target:1,tet?'Hũ "'+tet.name+'" đủ tiền mục tiêu.':'Lập hũ Tết ở trang Ngân sách.','đ'),
    B('📒','Ghi chép 30 lần',S.txns.length,30,'Ghi 30 giao dịch vào sổ.',' lần'),
    B('⛰️','Nửa đường',Math.round(lv.p*100),50,'Đi được 50% hành trình: nợ ròng còn một nửa so với lúc bắt đầu.','%'),
  ];
}
const bval=(b,v)=>b.unit==='đ'?k(v):v+b.unit;

/* ---------- writes ---------- */
async function w(fn){ if(!db||!canWrite) return false; try{ await fn(); return true }catch(e){ toast(e&&e.code==='invalid_argument'?'Bạn không có quyền sửa sổ này.':'Chưa lưu được, thử lại nhé.'); if(e&&e.code==='invalid_argument'){canWrite=false;render()} return false } }
function toast(msg,undo){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.innerHTML='<span></span>'+(undo?'<button type="button">Hoàn tác</button>':'');t.firstChild.textContent=msg;
  if(undo)t.querySelector('button').onclick=()=>{t.hidden=true;undo()};t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,undo?5000:2600)}
async function togglePay(key){
  const it=items().find(i=>i.key===key); if(!it) return;
  if(it.paid) await w(()=>db.doc('payments/'+key).delete());
  else if(await w(()=>db.doc('payments/'+key).set({debtId:it.debt.id,ym:it.ym,amount:it.amount,paidAt:todayS()}))) toast('Đã trả '+it.debt.name+'. Bớt được một kỳ nợ!');
}
async function addTx(doc,msg){const ref=db.collection('txns').doc();if(await w(()=>ref.set(doc)))toast(msg,()=>w(()=>ref.delete()))}

/* ---------- detail sheets ---------- */
let ROW_COMPACT=false;
const sh=(kind,arg)=>`data-sheet="${kind}"${arg!=null?` data-arg="${esc(arg)}"`:''}`;
const dayName=d=>['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'][D(d).getDay()]+', '+dd(d)+'/'+mm(d);
const kv=(a,b,cls)=>`<div class="kv"><span>${a}</span><b${cls?` class="${cls}"`:''}>${b}</b></div>`;
const txRow=t=>`<div class="item"><div class="main"><div class="t">${esc(catName(t.cat))}</div>${t.note?`<div class="s">${esc(t.note)}</div>`:''}</div><span class="amt" style="color:${t.dir==='in'?'var(--good)':'var(--ink)'}">${t.dir==='in'?'+':'−'}${vnd(t.amount)}</span></div>`;
function sheetDay(d){
  const t=todayS();
  if(d<trackStart()) return {title:dayName(d),body:'<div class="empty">Sổ bắt đầu theo dõi từ '+dd(trackStart())+'/'+mm(trackStart())+'. Ngày này chưa có dữ liệu.</div>'};
  const a=allowance(d.slice(0,7)), sp=flexSpent(d), txs=S.txns.filter(x=>x.date===d);
  const flex=txs.filter(x=>x.dir==='out'&&FLEX.includes(x.cat)), other=txs.filter(x=>!(x.dir==='out'&&FLEX.includes(x.cat)));
  const pays=Object.entries(S.payments).filter(([,p])=>p.paidAt===d).map(([key,p])=>({key,p,it:items().find(i=>i.key===key)}));
  const due=items().filter(i=>i.date===d);
  const diff=a==null?null:a-sp;
  const verdict=a==null?'':d===t?(diff>=0?`<div class="verdict ok">Còn ${vnd(diff)}. Giữ đến tối là vào hũ.</div>`:`<div class="verdict over">Đang vượt ${vnd(-diff)}.</div>`)
    :(diff>=0?`<div class="verdict ok">✓ Giữ mức. +${vnd(diff)} vào hũ.</div>`:`<div class="verdict over">! Vượt mức ${vnd(-diff)}. Hũ bị trừ, chuỗi về 0.</div>`);
  return {title:dayName(d)+(d===t?' (hôm nay)':''),body:`${verdict}
    <div class="kvs">${kv('Mức ngày',a==null?'—':vnd(a))}${kv('Đã tiêu (ăn, tiêu thoải mái)',vnd(sp),diff!=null&&diff<0?'neg':'')}</div>
    <h4>Tính vào mức ngày</h4><div class="list">${flex.length?flex.map(txRow).join(''):'<div class="empty sm">Không có khoản nào.</div>'}</div>
    ${other.length?`<h4>Khoản khác trong ngày</h4><p class="note">Không tính vào mức ngày (xăng, hiếu hỉ, tiền vào...).</p><div class="list">${other.map(txRow).join('')}</div>`:''}
    ${pays.length?`<h4>Trả nợ trong ngày</h4><div class="list">${pays.map(x=>`<div class="item"><div class="main"><div class="t">${esc(x.it?x.it.debt.name:x.p.debtId)}</div><div class="s">Kỳ ${x.p.ym.slice(5)}/${x.p.ym.slice(0,4)}</div></div><span class="amt">−${vnd(x.p.amount)}</span></div>`).join('')}</div>`:''}
    ${due.length?`<h4>Đến hạn ngày này</h4><div class="list">${due.map(itemRow).join('')}</div>`:''}`};
}
function sheetJar(){
  const t=todayS(), ym=t.slice(0,7), p=period(ym), a=allowance(ym), jr=jar(ym), rows=[];
  if(a!=null) for(let d=p.start; d<=p.end && d<t; d=addDay(d,1)) rows.push({d,v:a-flexSpent(d)});
  const sk=S.wishes.filter(x=>x.status==='skipped'&&(x.decidedAt||x.createdAt||'').slice(0,7)===ym);
  return {title:'Hũ '+mName(ym).toLowerCase(),body:`<div class="sheet-big">${vnd(Math.max(0,jr.total))}</div>

    body=`<div class="card"><div class="list">${active.map(d=>{const sc=schedule(d),left=sc.filter(i=>!i.paid),r=left.reduce((s,i)=>s+i.amount,0);
      return `<button class="item rowbtn" ${sh('debt',d.id)} style="display:block"><div class="row"><span class="t">${esc(d.name)}</span><span class="amt">${vnd(r)} ›</span></div><div class="s">${d.rate?'Lãi '+esc(d.rate)+' · ':''}còn ${left.length} kỳ${left.length?', xong '+mShort(sc[sc.length-1].ym):''}</div><div class="prog">${sc.length<=36?sc.map(i=>`<i class="${i.paid?'p':''}"></i>`).join(''):''}</div></button>`}).join('')}
      ${fams.map(fam=>`<button class="item rowbtn" ${sh('debt',fam.id)} style="display:block"><div class="row"><span class="t">${esc(fam.name)}</span><span class="amt">${vnd(remainingOf(fam))} ›</span></div><div class="s">${esc(fam.rate||'Không lãi')}</div></button>`).join('')}</div></div>
      ${done.length?`<details class="card fold"><summary><h3>Đã xong (${done.length})</h3></summary><div class="list">${done.map(d=>`<div class="item"><span class="dot ok">✓</span><div class="main"><div class="t">${esc(d.name)}</div><div class="s">${esc(d.note||'')}</div></div></div>`).join('')}</div></details>`:''}`}
  else {const months=[];for(let i=0;i<12;i++){const m=addYm(ym,i);months.push({m,v:all.filter(x=>x.ym===m).reduce((s,x)=>s+x.amount,0)})}
    const inc=S.meta?.incomeMonthly||0, mx=Math.max(inc,...months.map(x=>x.v),1);

    <div class="chart">${months.map(x=>`<button class="crow ${x.m===ym?'now':''}" ${sh('month',x.m)}><span>${mShort(x.m)}</span><div class="track"><i style="width:${(x.v/mx*100).toFixed(1)}%"></i>${inc?`<span style="position:absolute;top:-2px;bottom:-2px;left:${(inc/mx*100).toFixed(1)}%;border-left:2px dashed var(--muted)"></span>`:''}</div><span class="v">${tr(x.v)}</span></button>`).join('')}</div></div>`}
  return head+body;
}

function vSchedule(){

  const end=S.showAll?'9999-99':addYm(ym,2);

  const groups={};shown.forEach(i=>{(groups[i.ym]=groups[i.ym]||[]).push(i)});
  const keys=Object.keys(groups).sort();
  return `<h2>Lịch trả nợ</h2>${canWrite?'<p class="note" style="margin:0">Trả xong khoản nào thì bấm vòng tròn. Tiền đang có tự trừ, thanh tiến độ ở Hành trình tự tăng.</p>':''}
  ${keys.length?keys.map(key=>{const g=groups[key];const tot=g.reduce((s,i)=>s+i.amount,0),left=g.filter(i=>!i.paid).reduce((s,i)=>s+i.amount,0);

function zeroBox(bc,ym){
  const L=bc.left, cls=Math.abs(L)<1000?'ok':L>0?'left':'over';
  return `<div class="zero ${cls}"><span class="lbl" style="color:inherit">${mName(ym)}</span><div class="v">${cls==='ok'?'Đã về 0 ✓':cls==='left'?'Còn '+vnd(L)+' chưa có việc':'Giao quá '+vnd(-L)}</div><div style="font-size:13px">${cls==='ok'?'Đồng nào cũng có việc. Phần để dành là dòng Dự phòng.':cls==='left'?'Giao nốt cho một dòng nào đó, thường là Dự phòng.':'Bớt một dòng nào đó cho cân.'}</div></div>`;
}

  ${explain}
  <div class="card"><h3>Tiền có</h3><div class="list">
    <div class="bline"><label class="nm" for="b-start">Mang sang</label>${canWrite?`<input class="money" type="text" inputmode="numeric" autocomplete="off" id="b-start" data-bt="start" value="${fmtIn(b.start)}">`:`<span class="amt">${vnd(b.start)}</span>`}<span class="sp">Tiền đang có lúc lập, hoặc Dự phòng tháng trước.</span></div>
    <div class="bline"><label class="nm" for="b-income">Thu nhập sẽ nhận</label>${canWrite?`<input class="money" type="text" inputmode="numeric" autocomplete="off" id="b-income" data-bt="income" value="${fmtIn(b.income)}">`:`<span class="amt">${vnd(b.income)}</span>`}<span class="sp">Đã nhận: ${vnd(inc)}</span></div>
  </div></div>
  <div class="card"><div class="row"><h3>Giao việc</h3>${canWrite&&Math.abs(bc.left)>=1000?`<button class="sm" data-fill="${ym}">Cân bằng bằng Dự phòng</button>`:''}</div><div class="list">

    const now=new Date(), mLeft=f.due?Math.max(1,(Number(f.due.slice(0,4))-now.getFullYear())*12+Number(f.due.slice(5,7))-(now.getMonth()+1)+1):0;

    ${canWrite?`<form class="f" id="fundForm" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><input type="text" id="fName" placeholder="Tên hũ, ví dụ Sửa xe" required maxlength="40"><div class="two"><input type="text" inputmode="numeric" autocomplete="off" class="moneyin" id="fTarget" placeholder="Cần bao nhiêu" required><input type="text" id="fDue" placeholder="Hạn (VD 2027-03)" pattern="\\d{4}-\\d{2}"></div><button type="submit">Thêm hũ</button><p class="note" style="margin:0">Bỏ tiền vào hũ: ghi giao dịch mục "Quỹ ..." ở Ghi chép.</p></form>`:''}</div>`;
}

  <div class="grid2"><div class="card"><div class="lbl">Tiền vào</div><div class="big" style="font-size:22px;color:var(--good)">${vnd(inS)}</div></div><div class="card"><div class="lbl">Chi ra</div><div class="big" style="font-size:22px">${vnd(outS)}</div></div></div>
  <div class="card"><div class="list">${list.length?Object.keys(byDate).map(d=>`<div class="lbl" style="padding-top:10px">${WD[D(d).getDay()]} ${dd(d)}/${mm(d)}</div>`+byDate[d].map(t=>`<div class="item"><div class="main"><div class="t">${esc(catName(t.cat))}</div>${t.note?`<div class="s">${esc(t.note)}</div>`:''}</div><span class="amt" style="color:${t.dir==='in'?'var(--good)':'var(--ink)'}">${t.dir==='in'?'+':'−'}${vnd(t.amount)}</span>${canWrite?(S.confirmDel===t.id?`<span class="confirm"><button class="sm" data-del="${esc(t.id)}" style="color:var(--bad)">Xóa</button><button class="sm ghost" data-nodel="1">Thôi</button></span>`:`<button class="ghost sm" data-askdel="${esc(t.id)}" aria-label="Xóa giao dịch">✕</button>`):''}</div>`).join('')).join(''):'<div class="empty">Tháng này chưa có giao dịch nào.</div>'}</div></div>

/* ---------- render & events ---------- */
function header(){
  const c=cash(), lv=S.got?level():null;
  document.getElementById('hello').innerHTML=`Chào Tùng<small>Tiền đang có: <b style="color:var(--ink)">${c==null?'—':vnd(c)}</b></small>`;
  const chip=document.getElementById('lvchip');
  if(lv){chip.hidden=false;chip.innerHTML=`<b>${lv.i}</b>${esc(lv.name)}`}
}
function render(){
  header();
  if(!S.got){ document.getElementById('v-hom-nay').innerHTML='<div class="card empty">Đang mở sổ…</div>'; return }
  const ae=document.activeElement, aid=ae&&ae.id, sel=(ae&&ae.selectionStart!=null)?[ae.selectionStart,ae.selectionEnd]:null, keep={};
  ['txAmt','txDate','txCat','txNote','fName','fTarget','fDue','wName','wPrice'].forEach(id=>{const e=document.getElementById(id);if(e)keep[id]=e.value});
  const map={'hom-nay':vToday,'hanh-trinh':vJourney,'lich-tra':vSchedule,'ngan-sach':vBudget,'ghi-chep':vTx};
  document.getElementById('v-'+S.view).innerHTML=map[S.view]();
  for(const id in keep){const e=document.getElementById(id);if(e&&keep[id]!=='')e.value=keep[id]}
  const wi=document.getElementById('wImpact'); if(wi) wi.innerHTML=impactHtml();
  if(aid){const e=document.getElementById(aid);if(e){e.focus();try{sel&&e.setSelectionRange(sel[0],sel[1])}catch{}}}
  ROW_COMPACT=false;
  if(S.sheet)renderSheet(false);
}
function show(v){
  if(!['hom-nay','hanh-trinh','lich-tra','ngan-sach','ghi-chep'].includes(v)) v='hom-nay';
  S.view=v; document.querySelectorAll('section.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  document.querySelectorAll('nav.tabs a').forEach(a=>{a.classList.toggle('on',a.dataset.v===v);if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{closeSheet();show(location.hash.slice(1))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});

document.addEventListener('click',e=>{if(e.target.closest('[data-import]'))document.getElementById('importFile').click()});
document.addEventListener('change',async e=>{if(e.target.id!=='importFile'||!e.target.files[0])return;
  try{const j=JSON.parse(await e.target.files[0].text());const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(j)});
    if(!r.ok)throw 0;const o=await r.json();await db.refresh();toast('Đã nhập '+o.imported+' mục.')}catch{toast('File không đúng định dạng sao lưu.')}e.target.value=''});
document.addEventListener('input',e=>{const el=e.target;if(el.matches&&el.matches('input.money,input.moneyin')){const dg=el.value.replace(/[^\d]/g,'');const f=dg?Number(dg).toLocaleString('vi-VN'):'';if(f!==el.value){el.value=f;try{el.setSelectionRange(f.length,f.length)}catch{}}}})
document.addEventListener('input',e=>{if(e.target.id==='wPrice'){const wi=document.getElementById('wImpact');if(wi)wi.innerHTML=impactHtml()}});
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-close]')){closeSheet();return}
  const sb=e.target.closest('[data-sheet]'); if(sb){openSheet(sb.dataset.sheet,sb.dataset.arg);return}
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.jtab){S.jTab=b.dataset.jtab;return render()}
  const d=b.dataset;
  if(d.pay) return togglePay(d.pay);
  if(d.q!=null){const q=(S.meta?.quick||QUICK_DEFAULT)[Number(d.q)];if(q)addTx({date:todayS(),amount:q.amount,dir:'out',cat:q.cat,note:q.label,src:'app'},'Đã ghi '+q.label+' '+k(q.amount));return}
  if(d.wish){const n=document.getElementById('wName').value.trim()||'Món chưa đặt tên', pr=parseMoney(document.getElementById('wPrice').value);
    if(!pr) return toast('Nhập giá trước đã.');
    const now=new Date().toISOString();
    const ok=await w(()=>db.collection('wishes').add(d.wish==='skip'?{name:n,price:pr,status:'skipped',createdAt:now,decidedAt:now}:{name:n,price:pr,status:'waiting',createdAt:now}));
    if(ok){document.getElementById('wName').value='';document.getElementById('wPrice').value='';toast(d.wish==='skip'?'Giỏi! '+vnd(pr)+' ở lại trong hũ.':'Đã hẹn 24 giờ. Mai xem còn muốn không nhé.');render()}
    return}
  if(d.wskip){const x=S.wishes.find(y=>y.id===d.wskip);if(await w(()=>db.doc('wishes/'+d.wskip).update({status:'skipped',decidedAt:new Date().toISOString()})))toast('Giỏi! '+vnd(x?.price)+' ở lại trong hũ.');return}
  if(d.wbuy){const x=S.wishes.find(y=>y.id===d.wbuy);if(!x)return;await w(()=>db.doc('wishes/'+x.id).update({status:'bought',decidedAt:new Date().toISOString()}));await addTx({date:todayS(),amount:x.price,dir:'out',cat:'choi',note:x.name,src:'app'},'Đã ghi mua '+x.name);return}
  if(d.bm){S.bYm=addYm(S.bYm,Number(d.bm));return render()}
  if(d.tm){S.tYm=addYm(S.tYm,Number(d.tm));return render()}
  if(d.showall){S.showAll=!S.showAll;return render()}
  if(d.dir){S.txDir=d.dir;return render()}
  if(d.askdel){S.confirmDel=d.askdel;return render()}
  if(d.nodel){S.confirmDel=null;return render()}
  if(d.del){const id=d.del;S.confirmDel=null;await w(()=>db.doc('txns/'+id).delete());return}
  if(d.newb){const ym=d.newb, prev=S.budgets[addYm(ym,-1)];
    const lines=prev?{...prev.lines,duphong:0}:Object.fromEntries(CATS.map(c=>[c.id,0]));
    await w(()=>db.doc('budgets/'+ym).set({start:prev?(Number(prev.lines?.duphong)||0):0,income:S.meta?.incomeMonthly||0,lines}));return}
  if(d.fill){const bc=budgetCalc(d.fill);if(!bc)return;const nv=Math.max(0,(Number(bc.b.lines?.duphong)||0)+bc.left);
    await w(()=>db.doc('budgets/'+d.fill).update({lines:{duphong:Math.round(nv)}}));return}
});
document.addEventListener('change',async e=>{
  const t=e.target, d=t.dataset; const v=parseMoney(t.value);
  if(d.bl){await w(()=>db.doc('budgets/'+S.bYm).update({lines:{[d.bl]:v}}))}
  else if(d.bt){await w(()=>db.doc('budgets/'+S.bYm).update({[d.bt]:v}))}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='txForm'){
    const amt=parseMoney(document.getElementById('txAmt').value); if(amt<=0) return toast('Nhập số tiền trước đã.');
    await addTx({date:document.getElementById('txDate').value||todayS(),amount:amt,dir:S.txDir,cat:document.getElementById('txCat').value,note:document.getElementById('txNote').value.trim(),src:'app'},'Đã lưu '+vnd(amt));
    ['txAmt','txNote'].forEach(id=>{const x=document.getElementById(id);if(x)x.value=''});
  }
  if(e.target.id==='fundForm'){
    const name=document.getElementById('fName').value.trim(), target=parseMoney(document.getElementById('fTarget').value), due=document.getElementById('fDue').value.trim();
    if(!name||!target) return;
    if(await w(()=>db.collection('funds').add({name,target,due,saved:0,note:''}))){['fName','fTarget','fDue'].forEach(id=>{const x=document.getElementById(id);if(x)x.value=''});toast('Đã thêm hũ '+name)}
  }
});

/* ---------- boot ---------- */
(function init(){const ym=todayS().slice(0,7);S.bYm=ym;S.tYm=ym;show(location.hash.slice(1)||'hom-nay')})();
/* ---------- kho dữ liệu: gọi API của server (thay cho kho của Claude) ---------- */
function makeDb(){
  const store={}, listeners=new Set();
  const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(15)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
  const meta={fromCache:false,hasPendingWrites:false};
  const docSnap=(c,id)=>{const d=store[c]&&store[c][id];return {id,exists:!!d,data:()=>d,metadata:meta}};
  const colSnap=c=>{const docs=Object.keys(store[c]||{}).sort().map(id=>docSnap(c,id));return {docs,size:docs.length,empty:!docs.length,metadata:meta}};
  const notify=()=>listeners.forEach(l=>{try{l.fire()}catch(e){console.error(e)}});
  async function call(method,url,body){
    const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
    if(r.status===401){location.reload();throw {code:'revoked',message:'Cần đăng nhập lại'}}
    if(!r.ok){let j={};try{j=await r.json()}catch{} throw {code:j.code||'unavailable',message:j.message||('HTTP '+r.status)}}
    return r.json();
  }
  async function refresh(){const j=await call('GET','/api/docs');for(const k in store)delete store[k];Object.assign(store,j.collections||{});notify()}
  const merge=(a,p)=>{const o={...(a||{})};for(const[k,v]of Object.entries(p||{})){if(v&&typeof v==='object'&&!Array.isArray(v)){if(v.__delete__===true){delete o[k];continue}o[k]=merge(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])?o[k]:{},v)}else o[k]=v}return o};
  function docRef(c,id){
    const u='/api/docs/'+encodeURIComponent(c)+'/'+encodeURIComponent(id);
    return {id,path:c+'/'+id,
      get:async()=>docSnap(c,id),
      async set(data){(store[c]=store[c]||{})[id]=JSON.parse(JSON.stringify(data));notify();try{await call('PUT',u,data)}catch(e){refresh().catch(()=>{});throw e}},
      async update(data){if(!store[c]||!store[c][id])throw {code:'invalid_argument',message:'Không có document này'};store[c][id]=merge(store[c][id],data);notify();try{await call('PATCH',u,data)}catch(e){refresh().catch(()=>{});throw e}},
      async delete(){if(store[c])delete store[c][id];notify();try{await call('DELETE',u)}catch(e){refresh().catch(()=>{});throw e}},
      onSnapshot(next){const l={fire:()=>next(docSnap(c,id))};listeners.add(l);if(S.loaded)l.fire();return ()=>listeners.delete(l)}};
  }
  function colRef(c){
    return {path:c,
      doc:id=>docRef(c,id||rid()),
      async add(data){const r=docRef(c,rid());await r.set(data);return r},
      get:async()=>colSnap(c),
      onSnapshot(next){const l={fire:()=>next(colSnap(c))};listeners.add(l);if(S.loaded)l.fire();return ()=>listeners.delete(l)}};
  }
  return {doc(p){const[c,id]=p.split('/');return docRef(c,id)},collection:colRef,refresh};
}
(async function connect(){
  const note=document.getElementById('loadNote');
  db=makeDb(); canWrite=true;
  const mark=()=>{S.got=1;render()};
  db.doc('meta/state').onSnapshot(s=>{S.meta=s.exists?s.data():null;mark()});
  db.collection('debts').onSnapshot(s=>{S.debts=s.docs.map(x=>({id:x.id,...x.data()}));mark()});
  db.collection('payments').onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());S.payments=o;mark()});
  db.collection('txns').onSnapshot(s=>{S.txns=s.docs.map(x=>({id:x.id,...x.data()}));mark()});
  db.collection('budgets').onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());S.budgets=o;mark()});
  db.collection('funds').onSnapshot(s=>{S.funds=s.docs.map(x=>({id:x.id,...x.data()}));mark()});
  db.collection('wishes').onSnapshot(s=>{S.wishes=s.docs.map(x=>({id:x.id,...x.data()}));mark()});
  const load=async()=>{try{await db.refresh();S.loaded=true;note.hidden=true}catch(e){note.textContent='Chưa tải được dữ liệu từ máy chủ. Kiểm tra mạng rồi tải lại trang.';note.hidden=false}};
  await load();
  // Đồng bộ khi mở lại app hoặc mỗi 30 giây (nếu đang mở), không làm mất chữ đang gõ
  const idle=()=>!document.activeElement?.matches('input,select,textarea');
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
  setInterval(()=>{if(!document.hidden&&idle())load()},30000);
  setInterval(()=>{if(S.got&&S.view==='hom-nay'&&idle())render()},60000);
})();
</script>
